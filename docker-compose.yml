services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dress
      POSTGRES_PASSWORD: dress
      POSTGRES_DB: dress_rental
    ports:
      - '5432:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dress -d dress_rental']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
