name: ci
on:
  pull_request:
  push: { branches: [master] }

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:emit
      - run: git diff --exit-code packages/contract
      - run: pnpm generate:api
      - run: git diff --exit-code apps/fe/src/api/generated apps/qr-admin/src/api/generated
      - run: pnpm check

  be:
    runs-on: ubuntu-latest
    services:
      # The invariant-proof suite must run against a REAL Postgres: the constraints under test
      # (EXCLUDE overlap, UNIQUE, CHECK) do not exist anywhere else.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dress
          POSTGRES_PASSWORD: dress
          POSTGRES_DB: dress_rental
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dress -d dress_rental"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://dress:dress@localhost:5432/dress_rental
      JWT_SECRET: ci-jwt-secret-value-0123456789
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-0123456789
      CLEANING_BUFFER_DAYS: '2'
      LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter be lint && pnpm --filter be arch
      - run: pnpm --filter be test
      # Creates dress_rental_test, migrates it, then proves the DB-level invariants
      # (docs/spec/init-nestjs-hexagonal/09-testing-strategy.md — "Invariant proof tests").
      - run: pnpm --filter be test:e2e

  fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fe lint && pnpm --filter fe arch
      - run: pnpm --filter fe test
      - run: pnpm --filter fe build

  qr-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter qr-admin lint && pnpm --filter qr-admin arch
      - run: pnpm --filter qr-admin test
      - run: pnpm --filter qr-admin build
