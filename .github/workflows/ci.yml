name: ci
on:
  pull_request:
  push: { branches: [master] }

# A newer push to the same pull request makes the older run pointless, so drop
# it. Runs on master are never cancelled: every master commit keeps its own proof.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the jobs below have inputs that actually changed. Every job
  # gates on this, so a pull request that only touches one app pays for one job.
  scope:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
      qr: ${{ steps.filter.outputs.qr }}
      web: ${{ steps.filter.outputs.web }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: filter
        run: bash .github/scripts/ci-scope.sh

  # Harness ledger lint (docs/spec/init-harness/08: valid JSON, one in-progress, evidence on
  # every pass, strict fields on entries carrying `tier`) + vendored-spec integrity
  # (docs/spec/README.md §Sync provenance). Node only, no install, so it runs on every push.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/ledger.mjs check
      - name: vendored spec unchanged since last sync
        run: cd docs/spec && sha256sum --quiet -c SHA256SUMS

  # The three drift gates, kept together in one fast job (no DB, no browser) as
  # docs/spec/init-monorepo-contract/03-ci-and-runtime.md §1 specifies. Gate 3
  # (`pnpm check`) type checks every app, so ci-scope.sh runs this job whenever
  # any app changes.
  contract:
    needs: scope
    if: needs.scope.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:emit
      - run: git diff --exit-code packages/contract
      - run: pnpm generate:api
      - run: git diff --exit-code apps/fe/src/api/generated apps/qr-admin/src/api/generated apps/web/src/api/generated
      - run: pnpm check

  be:
    needs: scope
    if: needs.scope.outputs.be == 'true'
    runs-on: ubuntu-latest
    services:
      # The invariant-proof suite must run against a REAL Postgres: the constraints under test
      # (EXCLUDE overlap, UNIQUE, CHECK) do not exist anywhere else.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dress
          POSTGRES_PASSWORD: dress
          POSTGRES_DB: dress_rental
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dress -d dress_rental"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://dress:dress@localhost:5432/dress_rental
      JWT_SECRET: ci-jwt-secret-value-0123456789
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-0123456789
      CLEANING_BUFFER_DAYS: '2'
      LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter be lint && pnpm --filter be arch
      - run: pnpm --filter be test
      # Creates dress_rental_test, migrates it, then proves the DB-level invariants
      # (docs/spec/init-nestjs-hexagonal/09-testing-strategy.md — "Invariant proof tests").
      - run: pnpm --filter be test:e2e

  fe:
    needs: scope
    if: needs.scope.outputs.fe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fe lint && pnpm --filter fe arch
      - run: pnpm --filter @dress-rental/image-url check && pnpm --filter @dress-rental/image-url test
      - run: pnpm --filter fe test
      - run: pnpm --filter fe build

  qr-admin:
    needs: scope
    if: needs.scope.outputs.qr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter qr-admin lint && pnpm --filter qr-admin arch
      - run: pnpm --filter qr-admin test
      - run: pnpm --filter qr-admin build

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint && pnpm --filter web arch
      - run: pnpm --filter web test
      # `next build` also type checks, and its route table is the rendering truth.
      - run: pnpm --filter web build
      # URL/navigation regressions run against this production build; no BE/DB required.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-playwright-results
          path: apps/web/test-results
          retention-days: 7

  e2e:
    # The browser proof (infra/e2e-ci): the vi-locale happy path in a real Chromium against the
    # real stack. Playwright starts the BE and the FE production build itself
    # (apps/fe/playwright.config.ts); this job only has to provide a migrated + seeded database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dress
          POSTGRES_PASSWORD: dress
          POSTGRES_DB: dress_rental
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dress -d dress_rental"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://dress:dress@localhost:5432/dress_rental
      JWT_SECRET: ci-jwt-secret-value-0123456789
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-0123456789
      CLEANING_BUFFER_DAYS: '2'
      LATE_FEE_PER_DRESS_PER_DAY: '200000'
      SEED_OWNER_USERNAME: owner
      # The happy path signs in with this exact pair (apps/fe/e2e/happy-path.spec.ts).
      SEED_OWNER_PASSWORD: changeme
      LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fe exec playwright install --with-deps chromium
      - run: pnpm --filter be migrate
      - run: pnpm --filter be seed
      - run: pnpm --filter fe e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/fe/playwright-report
            apps/fe/test-results
          retention-days: 7
