name: deploy
# Manual production deploy to the Tencent VPS (cms.example.com + example.com). Never runs on push:
# a BE build stops the API for 1–2 minutes and the order (migrate → be → web) matters.
# How it works, secrets, versions, rollback, and the WSL fallback: infra/deploy/README.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy (branch, tag or SHA — must be on master and green in ci)
        default: master
        required: true
      only:
        description: auto = what changed since the recorded deploy; or force one part / everything
        type: choice
        options: [auto, all, be, fe, web]
        default: auto
      backup:
        description: auto = proven backup when the range has (or may have) a migration; always = backup anyway
        type: choice
        options: [auto, always]
        default: auto
      bump:
        description: New version vX.Y.Z — patch = fixes/UI, minor = new feature or migration, major = big change
        type: choice
        options: [patch, minor, major]
        default: patch

# One deploy at a time, and never cancel one half-way (an API stopped mid-build stays stopped).
# rollback.yml shares this group, so a rollback queues behind a running deploy and vice versa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      # Only a recorded (complete, verified) run names a version.
      mint: ${{ steps.record.outcome == 'success' && steps.plan.outputs.mint || 'false' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      DEPLOY_WEB_DOMAIN: ${{ vars.DEPLOY_WEB_DOMAIN }}
      DEPLOY_IMAGE_BASE_URL: ${{ vars.DEPLOY_IMAGE_BASE_URL }}
      # Two trees: the scripts come from THIS workflow's commit (ops/), the code that gets built from
      # the target (target/) — so rolling back to a commit older than infra/deploy/ still works.
      DEPLOY_TREE: ${{ github.workspace }}/target
      # The scripts' commit, written into every build's metadata (rollback.sh compares it).
      OPS_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target (on master, ci green)
        id: target
        working-directory: ops
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --verify -q "origin/$REF^{commit}" || git rev-parse --verify "$REF^{commit}")
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "::error::$SHA is not on master — merge it first"; exit 1; }
          CI=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push \
                 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          [ "$CI" -gt 0 ] || { echo "::error::no successful ci push run for $SHA — wait for ci or fix it"; exit 1; }
          echo "target $SHA ($(git log -1 --format=%s "$SHA"))"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"

      # No credentials in target/.git: `pnpm install` runs that tree's lifecycle scripts.
      - uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: SSH key + pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash ops/infra/deploy/ssh-setup.sh

      - name: Plan (parts, backup, version)
        id: plan
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ONLY: ${{ inputs.only }}
          BACKUP: ${{ inputs.backup }}
          BUMP: ${{ inputs.bump }}
        run: bash ops/infra/deploy/plan.sh

      - name: Backup (proven restore + R2) before migrating
        if: steps.plan.outputs.backup == 'true'
        run: bash ops/infra/deploy/backup.sh

      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.fe == 'true' || steps.plan.outputs.web == 'true'
        with:
          package_json_file: target/package.json
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.fe == 'true' || steps.plan.outputs.web == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: pnpm install (target tree)
        if: steps.plan.outputs.fe == 'true' || steps.plan.outputs.web == 'true'
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: BE — ship tree, build + migrate + restart on the VPS
        if: steps.plan.outputs.be == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash ops/infra/deploy/be.sh

      - name: FE — build here, swap dist on the VPS
        if: steps.plan.outputs.fe == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash ops/infra/deploy/fe.sh

      - name: Web — build here (after BE), swap + restart dress-web
        if: steps.plan.outputs.web == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: bash ops/infra/deploy/web.sh

      - name: Verify production
        run: bash ops/infra/deploy/verify.sh

      - name: Record deployed SHA + history
        id: record
        if: steps.plan.outputs.record == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
          PARTS: ${{ steps.plan.outputs.parts }}
          KIND: deploy
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash ops/infra/deploy/record.sh

      - name: Summary
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "### deploy ${{ steps.plan.outputs.version }} (${TARGET_SHA:0:7}) — ${{ job.status }}"
            echo "be=${{ steps.plan.outputs.be }} fe=${{ steps.plan.outputs.fe }} web=${{ steps.plan.outputs.web }} backup=${{ steps.plan.outputs.backup }} record=${{ steps.record.outcome }} new-tag=${{ steps.plan.outputs.mint }}"
            echo ""
            echo "Then: set \`deploy.deployed\` on the shipped ledger entries + the Production bullet in AGENTS.md."
            echo "Something wrong after this deploy? Actions → **rollback** (no build, under a minute)."
          } >>"$GITHUB_STEP_SUMMARY"

  # The ONLY job allowed to write to the repo, and it never runs a target tree's code.
  tag:
    needs: deploy
    if: needs.deploy.outputs.mint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          TARGET_SHA: ${{ needs.deploy.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap '[ $? = 0 ] || echo "::error::production already runs $VERSION (${TARGET_SHA:0:7}) — create the tag by hand: git tag -a $VERSION $TARGET_SHA && git push origin $VERSION"' EXIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$TARGET_SHA" -m "production $VERSION — $RUN_URL"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes --notes-start-tag "$PREVIOUS"
          echo "### tagged $VERSION → ${TARGET_SHA:0:7}" >>"$GITHUB_STEP_SUMMARY"
